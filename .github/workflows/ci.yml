name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-7f91a2c8-4d63-40b5-9e17-strong-verification-key
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_SECURE_HSTS_SECONDS: "3600"
      DJANGO_SECURE_HSTS_PRELOAD: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run build:css
      - run: python manage.py check --deploy --settings=sami_project.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=sami_project.test_settings
      - run: python manage.py test --settings=sami_project.test_settings
