<div{% if wrapper_class %} class="{{ wrapper_class }}"{% endif %}>
    <label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-semibold text-brand-navy">{{ field.label }}{% if field.field.required %} <span class="text-rose-600">*</span>{% endif %}</label>
    {{ field }}
    {% for error in field.errors %}<p id="id_{{ field.name }}_error" class="mt-2 text-sm font-semibold text-rose-600">{{ error }}</p>{% endfor %}
    {% if field.help_text %}<p class="mt-2 text-xs leading-5 text-slate-500">{{ field.help_text }}</p>{% endif %}
</div>
